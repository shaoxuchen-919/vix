name: VIX WeChat Monitor

on:
  schedule:
    # VIX closes at 20:15 UTC in U.S. daylight time and 21:15 UTC otherwise.
    # Two runs improve resilience if the Cboe CSV update or GitHub cron is delayed.
    - cron: "47 22 * * 1-5"
    - cron: "47 23 * * 1-5"
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a test notification instead of checking VIX
        required: true
        type: boolean
        default: false

concurrency:
  group: vix-wechat-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python monitor.py --test-notification

      - name: Check VIX
        if: ${{ github.event_name == 'schedule' || !inputs.send_test }}
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python monitor.py

      - name: Persist last checked date
        if: ${{ success() && (github.event_name == 'schedule' || !inputs.send_test) }}
        run: |
          if git diff --quiet -- state.json; then
            echo "State is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update VIX monitor state [skip ci]"
          git push
